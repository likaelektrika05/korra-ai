[project]
name = "korra-m10"
version = "0.10.0"
description = "Korra Project 10: student database tools on their own graph nodes."
authors = [{ name = "Lia Surguladze" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.0",
    "langchain-core>=1.2.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["korra_m10", "korra_m10.tools"]

[tool.setuptools.package-dir]
"korra_m10" = "src/korra_m10"
"korra_m10.tools" = "src/korra_m10/tools"
