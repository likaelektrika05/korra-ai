[project]
name = "korra-react"
version = "0.12.0"
description = "Korra Project 12: behavioral control layer (system prompt, templates, controlled ReAct)."
authors = [{ name = "Lia Surguladze" }]
requires-python = ">=3.11"
dependencies = ["langgraph>=1.2.11", "langchain-openai>=1.6.0", "langchain-core>=1.2.0",
                "psycopg[binary]>=3.2", "pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["korra_react"]

[tool.setuptools.package-dir]
"korra_react" = "src/korra_react"
